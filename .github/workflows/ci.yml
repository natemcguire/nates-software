name: CI

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Fresh CI runners have no global git identity / default-branch config, so
      # the `slop fork` tests that create real git worktrees (git init + commit)
      # fail there but pass locally. Configure a clean, deterministic git env.
      - name: Configure git for worktree tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@nates-software.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'

      - name: Install dependencies
        run: |
          npm ci
          if [ -f services/terminal-gateway/package.json ]; then
            npm ci --prefix services/terminal-gateway
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
