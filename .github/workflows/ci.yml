name: CI

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          if [ -f services/terminal-gateway/package.json ]; then
            npm ci --prefix services/terminal-gateway
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
