name = "nates-software"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
GITSMITH_GATEWAY_URL = "https://gitsmith-gateway-production.up.railway.app"

# Cloudflare D1 (Serverless SQLite at Edge)
[[d1_databases]]
binding = "DB"
database_name = "nates-software-prod-v2"
database_id = "32dc20dc-b97b-4ea8-a108-45694cdd6e6c"

# Cloudflare R2 (Zero Egress Binary Storage for .dmg, .exe, .AppImage, .sqlite)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "nates-software-storage"

# All ephemeral Pages release candidates share isolated preview infrastructure.
# Cloudflare Pages applies preview configuration to every preview branch, so
# this must never point at production D1 or R2 resources.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "nates-software-preview-db"
database_id = "a265f092-cee4-42da-ac84-e87dbbd53315"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "nates-software-preview-storage"

[env.preview.vars]
GITSMITH_GATEWAY_URL = "https://gitsmith-gateway-production.up.railway.app"
