name = "nates-software"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 (Serverless SQLite at Edge)
[[d1_databases]]
binding = "DB"
database_name = "nates-software-db"
database_id = "3ae839e3-b677-4668-9b12-48b5c2437b5b"

# Cloudflare R2 (Zero Egress Binary Storage for .dmg, .exe, .AppImage, .sqlite)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "nates-software-storage"
