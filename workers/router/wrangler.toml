name = "nates-software-router"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Canary Secret (local/dev placeholder; Claude sets the real secret via `wrangler secret put CANARY_SECRET` in prod)
[vars]
CANARY_SECRET = "placeholder-canary-secret-override-in-prod"

# Cloudflare D1 (Serverless SQLite at Edge)
[[d1_databases]]
binding = "DB"
database_name = "nates-software-prod-v2"
database_id = "32dc20dc-b97b-4ea8-a108-45694cdd6e6c"

# Cloudflare R2 (Zero Egress Binary & Static Asset Storage)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "nates-software-storage"

# Cloudflare KV (Host Resolution Cache)
[[kv_namespaces]]
binding = "HOST_CACHE"
id = "a99be7ce7e6d42639088dd57bc5ec0b7"

