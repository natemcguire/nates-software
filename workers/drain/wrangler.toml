name = "nates-software-drain"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Pin the account that owns the D1 database this Worker reads/writes. Worker
# crons can only bind resources in the account that owns them; wrangler's
# default account may differ (this machine has multiple).
account_id = "4219a576830c72b0e6e4ca358e61473a"
# Scheduled-only Worker: no HTTP route, no workers.dev endpoint. The `fetch`
# handler exported by src/index.ts exists only for local `wrangler dev` smoke
# testing and is never exposed publicly.
workers_dev = false

# Re-drive tick: every 3 minutes. Frequent enough that a stranded
# stripe_event_inbox row (or, once commissioned, a stranded transfer outbox
# row) doesn't sit for long, bounded enough to stay well under Cloudflare's
# cron Worker CPU/invocation budget given each tick processes a small bounded
# batch (see DEFAULT_INBOX_BATCH_SIZE / DEFAULT_TRANSFER_BATCH_SIZE).
[triggers]
crons = ["*/3 * * * *"]

# STRIPE_SECRET_KEY, PAYOUT_WORKER_SECRET, and LICENSE_ENCRYPTION_KEYS_JSON are
# SECRETS, not vars — never commit values here. Set them with
# `wrangler secret put <NAME> --config workers/drain/wrangler.toml`, and locally
# via an untracked `.dev.vars` file in workers/drain/. The Worker reads them
# from env.<NAME> either way.

[vars]
STRIPE_LIVEMODE = "false"
# Payouts stay off. Flip only when the payout path has been commissioned and
# PAYOUT_WORKER_SECRET / Stripe Connect destination accounts are ready.
PAYOUTS_ENABLED = "false"

# Cloudflare D1 (Serverless SQLite at Edge) — same production database the
# Pages project and router Worker use. This Worker only ever calls the
# existing commerce state machine functions against it; it never runs its own
# SQL beyond a read-only candidate-id SELECT for the inbox path.
[[d1_databases]]
binding = "DB"
database_name = "nates-software-prod-v2"
database_id = "32dc20dc-b97b-4ea8-a108-45694cdd6e6c"
